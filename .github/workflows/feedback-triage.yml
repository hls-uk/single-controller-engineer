name: Feedback triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: feedback-triage
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.repository == 'hls-uk/single-controller-engineer' && vars.SCE_FEEDBACK_TRIAGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { triagePlan } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/feedback-triage.mjs`,
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            async function currentPlan(canonicalIssueNumber) {
              const issueRows = await github.paginate(
                github.rest.issues.listForRepo,
                { owner, repo, state: "open", per_page: 100 },
              );
              const discovery = {
                issues: issueRows
                  .filter((issue) => issue.pull_request === undefined)
                  .map((issue) => ({
                    body: issue.body ?? "",
                    number: issue.number,
                    open: issue.state === "open",
                  })),
                paginationComplete: true,
                repositoryId: context.payload.repository.node_id,
                schema: "sce.feedback-discovery",
                version: 1,
              };
              const current = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              if (
                current.data.pull_request !== undefined ||
                current.data.state !== "open"
              ) return { action: "none" };
              const row = discovery.issues.findIndex(
                (issue) => issue.number === current.data.number,
              );
              if (row === -1) return { action: "none" };
              discovery.issues[row] = {
                body: current.data.body ?? "",
                number: current.data.number,
                open: current.data.state === "open",
              };
              if (canonicalIssueNumber !== undefined) {
                const canonical = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: canonicalIssueNumber,
                });
                if (
                  canonical.data.pull_request !== undefined ||
                  canonical.data.state !== "open" ||
                  canonical.data.number !== canonicalIssueNumber
                ) return { action: "none" };
                const canonicalRow = discovery.issues.findIndex(
                  (issue) => issue.number === canonical.data.number,
                );
                if (canonicalRow === -1) return { action: "none" };
                discovery.issues[canonicalRow] = {
                  body: canonical.data.body ?? "",
                  number: canonical.data.number,
                  open: canonical.data.state === "open",
                };
              }
              return triagePlan(
                {
                  issue: {
                    body: current.data.body ?? "",
                    number: current.data.number,
                    state: current.data.state,
                  },
                  repository: { node_id: context.payload.repository.node_id },
                },
                discovery,
              );
            }
            async function revalidatedPlan() {
              const planned = await currentPlan();
              if (planned.action !== "apply") return planned;
              const confirmed = await currentPlan(planned.canonicalIssueNumber);
              return (
                confirmed.action === "apply" &&
                confirmed.canonicalIssueNumber === planned.canonicalIssueNumber &&
                confirmed.comment === planned.comment
              ) ? confirmed : { action: "none" };
            }
            let plan = await revalidatedPlan();
            if (plan.action !== "apply") return;
            plan = await revalidatedPlan();
            if (plan.action !== "apply") return;
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: plan.issueNumber,
              labels: ["duplicate"],
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: plan.issueNumber,
              per_page: 100,
            });
            plan = await revalidatedPlan();
            if (plan.action !== "apply") return;
            const alreadyCommented = comments.some(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.user.type === "Bot" &&
                comment.body === plan.comment,
            );
            if (!alreadyCommented)
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: plan.issueNumber,
                body: plan.comment,
              });
