    id: problem
    attributes: { label: Problem or limitation }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Desired generic capability }
    validations: { required: true }
  - type: textarea
    id: workaround
    attributes: { label: Current workaround }
